# .github/workflows/real-hardware.yml
# GPU test matrix. Uses self-hosted runners (label: gpu-runner)
# that have actual Nvidia/AMD/Intel hardware. AMD and Intel cloud
# runners require repo-admin setup of the cloud account credentials
# in the runner config.

name: Real Hardware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    name: ${{ matrix.vendor.name }} (${{ matrix.vendor.label }})
    runs-on: gpu-runner-4xlarge
    strategy:
      fail-fast: false
      matrix:
        vendor:
          - name: Nvidia
            label: H100/A100
            extras: all,dev
            marker: gpu
            verify: |
              nvidia-smi
              nvcc --version
          - name: AMD
            label: MI300X
            extras: amd,sharding,dev
            marker: rocm
            verify: |
              rocm-smi
              ls /opt/rocm
          - name: Intel
            label: Gaudi
            extras: intel,sharding,dev
            marker: intel
            verify: |
              spirv-val --version
              ocloc version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (${{ matrix.vendor.name }})
        run: pip install -e .[${{ matrix.vendor.extras }}]
      - name: Verify hardware
        run: ${{ matrix.vendor.verify }}
      - name: Run GPU tests
        run: |
          python -m pytest src/tests/integration/test_full_pipeline.py -v \
            -m ${{ matrix.vendor.marker }} --tb=short -x

  cross-vendor-fat-binary:
    name: Cross-vendor fat binary
    needs: [gpu]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          echo "Cross-vendor test results (matrix job 'gpu'):"
          echo "  result: ${{ needs.gpu.result }}"
          if [[ "${{ needs.gpu.result }}" != "success" ]]; then
            echo "Cross-vendor fat binary test failed (one or more vendors failed)"
            exit 1
          fi
          echo "All vendors succeeded — cross-vendor fat binary is real"

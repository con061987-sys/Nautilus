# .github/workflows/real-hardware.yml
# GPU test matrix. Uses self-hosted runners (label: gpu-runner)
# that have actual Nvidia/AMD/Intel hardware. AMD and Intel cloud
# runners require repo-admin setup of the cloud account credentials
# in the runner config.

name: Real Hardware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvidia:
    name: Nvidia (H100/A100)
    runs-on: [self-hosted, gpu, nvidia]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e .[all,dev]
      - name: Verify CUDA
        run: |
          nvidia-smi
          nvcc --version
      - name: Run GPU tests
        run: |
          python -m pytest src/tests/integration/test_full_pipeline.py -v -m gpu \
            --tb=short -x

  amd:
    name: AMD (MI300X)
    runs-on: [self-hosted, gpu, amd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e .[amd,sharding,dev]
      - name: Verify ROCm
        run: |
          rocm-smi
          ls /opt/rocm
      - name: Run GPU tests
        run: |
          python -m pytest src/tests/integration/test_full_pipeline.py -v -m rocm \
            --tb=short -x

  intel:
    name: Intel (Gaudi)
    runs-on: [self-hosted, gpu, intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e .[intel,sharding,dev]
      - name: Verify oneAPI
        run: |
          spirv-val --version
          ocloc version
      - name: Run GPU tests
        run: |
          python -m pytest src/tests/integration/test_full_pipeline.py -v -m intel \
            --tb=short -x

  cross-vendor-fat-binary:
    name: Cross-vendor fat binary
    needs: [nvidia, amd, intel]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        run: |
          echo "Cross-vendor test results:"
          echo "  nvidia: ${{ needs.nvidia.result }}"
          echo "  amd:    ${{ needs.amd.result }}"
          echo "  intel:  ${{ needs.intel.result }}"
          if [[ "${{ needs.nvidia.result }}" != "success" || \
                "${{ needs.amd.result }}" != "success" || \
                "${{ needs.intel.result }}" != "success" ]]; then
            echo "Cross-vendor fat binary test failed"
            exit 1
          fi
          echo "All vendors succeeded — cross-vendor fat binary is real"

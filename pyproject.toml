[build-system]
requires = ["setuptools>=68.0", "wheel", "cmake>=3.18", "ninja", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nautilus"
version = "0.1.0"
description = "Cross-vendor AI compilation framework: PyTorch -> auto-tuned kernels -> fat binary -> auto-sharded across AMD/Intel/Nvidia clusters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Nautilus Project", email = "dev@nautilus.ai" },
]
keywords = [
    "triton", "tvm", "metaschedule", "gpu", "compiler",
    "amd", "intel", "nvidia", "fat-binary", "ai-compilation",
    "auto-sharding", "stablehlo", "gspmd", "xla",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

# Core dependencies — pinned to exact versions for reproducibility.
# Hardware-specific extras ([nvidia], [amd], [intel], [sharding])
# pull in Triton/TVM/torch/torch_xla.
dependencies = [
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
    "click>=8.1,<9.0",
    "rich>=13.7,<14.0",
    "pyzmq>=25.1,<27.0",
    "msgpack>=1.0,<2.0",
    "hypothesis>=6.100,<7.0",
    "tree-sitter>=0.20,<0.26",
    "tree-sitter-cpp>=0.20,<0.24",
]

[project.optional-dependencies]
nvidia = [
    "torch==2.4.1",
    "triton==3.0.0",
]
amd = [
    "torch==2.4.1",
    "triton==3.0.0",
    "aotriton==0.10",
]
intel = [
    "torch==2.4.1",
    "triton==3.0.0",
]
sharding = [
    "apache-tvm==0.18.0",
    "torch_xla==2.4.0",
    "networkx>=3.0,<4.0",
]
tuning = [
    "apache-tvm==0.18.0",
    "xgboost>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
]
cuda = [
    "tree-sitter>=0.20,<0.26",
    "tree-sitter-cpp>=0.20,<0.24",
]
rpc = ["apache-tvm[rpc]==0.18.0"]
all = [
    "torch==2.4.1",
    "triton==3.0.0",
    "apache-tvm==0.18.0",
    "torch_xla==2.4.0",
    "xgboost>=2.0,<3.0",
    "networkx>=3.0,<4.0",
    "aotriton==0.10",
    "tree-sitter>=0.20,<0.26",
    "tree-sitter-cpp>=0.20,<0.24",
]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-xdist>=3.5,<4.0",
    "pytest-asyncio>=0.23,<1.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "black>=24.0,<25.0",
    "hypothesis>=6.100,<7.0",
    "pre-commit>=3.7,<5.0",
]

# Triton backend plugin is loaded via TRITON_PLUGIN_DIRS at runtime, not
# via entry points, to avoid import-order conflicts when Triton starts up
# and scans the entry-point group at import time. Set the env var:
#   TRITON_PLUGIN_DIRS=$PWD/src/bridges/triton_tvm/backend
# to activate the custom TVM MetaSchedule backend.

[project.scripts]
nautilus = "src.cli.main:cli"
nautilus-tune = "src.cli.commands.tune:cli"
nautilus-build = "src.cli.commands.build:cli"
nautilus-shard = "src.cli.commands.shard:cli"
nautilus-verify = "src.cli.commands.verify:cli"

[project.urls]
Homepage = "https://github.com/nvindia-cud/NVINDIA_CUD"
Documentation = "https://nvindia-cud.github.io/NVINDIA_CUD"
Repository = "https://github.com/nvindia-cud/NVINDIA_CUD"
Issues = "https://github.com/nvindia-cud/NVINDIA_CUD/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["src.tests*", "src.*.tests", "tests*", "third_party*", "docs*", ".opencode*", "scripts*", "benchmarks*"]

[tool.setuptools.package-data]
"src.bridges.triton_tvm.lib" = ["*.so", "*.dylib", "*.dll", "CMakeLists.txt", "*.h", "*.cpp"]
"src.bridges.aot_packager" = ["*.c", "*.h"]
"src.c_api" = ["*.h"]
"src" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "gpu: requires a real GPU (Nvidia/AMD/Intel)",
    "cuda: requires CUDA toolkit installed",
    "rocm: requires ROCm installed",
    "intel: requires oneAPI/SYCL installed",
    "slow: tests that take more than 10 seconds",
    "integration: cross-bridge integration tests",
    "requires_deps: requires optional ML dependencies",
]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "triton.*", "triton", "torch.*", "torch", "torch_xla.*", "torch_xla",
    "tvm.*", "tvm", "aotriton", "pyzmq.*", "_pytest.*", "hypothesis.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/**/tests/*.py" = ["B011", "N802", "N803"]
"src/**/__init__.py" = ["F401", "F403"]
"src/c_api/**" = ["N802", "N803"]

[[tool.mypy.overrides]]
module = ["src.common.tests.*"]
ignore_errors = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
